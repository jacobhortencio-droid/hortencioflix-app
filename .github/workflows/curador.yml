name: Curador de fontes

on:
  push:
    branches: [ main ]
    paths: [ "curador/**", ".github/workflows/curador.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes
        run: node curador/test.mjs
      # Publica no Cloudflare Workers (gratuito) se os segredos existirem:
      # CLOUDFLARE_API_TOKEN (modelo «Edit Cloudflare Workers») e CLOUDFLARE_ACCOUNT_ID
      - name: Publicar no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltam os segredos CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID — testes feitos, nada publicado."
            exit 0
          fi
          set +e
          # diagnóstico (sem mostrar segredos): o token é válido? que contas vê? o Account ID bate?
          {
            echo "== token (utilizador):"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),(d.get('result') or {}).get('status'),[e.get('message') for e in d.get('errors',[])])"
            echo "== token (conta):"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),(d.get('result') or {}).get('status'),[e.get('message') for e in d.get('errors',[])])"
            echo "== contas que o token vê:"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=20" | python3 -c "import sys,json,os;d=json.load(sys.stdin);a=os.environ['CLOUDFLARE_ACCOUNT_ID'].strip();print('n=',len(d.get('result') or []),'Account ID do segredo bate:',any(x['id']==a for x in d.get('result') or []),'tamanho do segredo:',len(a),[e.get('message') for e in d.get('errors',[])])"
            echo "== subdomínio workers.dev:"; curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),d.get('result'),[e.get('message') for e in d.get('errors',[])])"
          } > /tmp/diag.txt 2>&1
          # conta nova sem subdomínio workers.dev: tenta registá-lo (hortencioflix, senão hortencioflix-<n>)
          if grep -q "do not have a workers.dev subdomain" /tmp/diag.txt; then
            for n in hortencioflix hortencioflix-tv hortencioflix-$RANDOM; do
              r=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain -d "{\"subdomain\":\"$n\"}")
              echo "== registar subdomínio $n: $(echo "$r" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('success'),[e.get('message') for e in d.get('errors',[])])")" >> /tmp/diag.txt
              echo "$r" | grep -qE '"success": ?true' && break
            done
            sleep 5
          fi
          cat /tmp/diag.txt
          cd curador
          npx -y wrangler@4 deploy > /tmp/deploy.txt 2>&1
          rc=$?
          cat /tmp/deploy.txt
          grep -oE "https://[a-z0-9.-]+\.workers\.dev" /tmp/deploy.txt | head -1 > /tmp/url.txt
          echo "Endereço: $(cat /tmp/url.txt)"
          # verificação em direto
          if [ -s /tmp/url.txt ]; then
            sleep 10
            u=$(cat /tmp/url.txt)
            echo "== em direto /health: $(curl -s --max-time 20 $u/health)" >> /tmp/diag.txt
            c=$(python3 -c "import base64,json;print(base64.urlsafe_b64encode(json.dumps({'a':['https://v3-cinemeta.strem.io']}).encode()).decode().rstrip('='))")
            echo "== em direto /stream: $(curl -s --max-time 30 $u/$c/stream/movie/tt0111161.json | head -c 300)" >> /tmp/diag.txt
          fi
          exit $rc
      - name: Guardar o endereço (ramo ci-curador)
        if: always()
        run: |
          [ -f /tmp/deploy.txt ] || exit 0
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan cur-tmp; git rm -rf . -q || true
          cp /tmp/url.txt curador-url.txt 2>/dev/null || touch curador-url.txt
          # registo da publicação (o wrangler não mostra o token)
          { cat /tmp/diag.txt 2>/dev/null; sed -E 's/[A-Za-z0-9_-]{35,}/***/g' /tmp/deploy.txt | tail -n 80; } > deploy-log.txt
          git add curador-url.txt deploy-log.txt
          git commit -qm "Curador publicado"; git push -f origin HEAD:ci-curador
